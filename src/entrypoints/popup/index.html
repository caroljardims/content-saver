<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Saver</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="w-[380px] bg-white text-slate-900">
    <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
      <h1 class="text-sm font-semibold">Content Saver</h1>
      <button
        id="sync"
        class="rounded px-2 py-1 text-xs text-slate-500 hover:bg-slate-100 hover:text-slate-900"
        title="Sync now"
      >
        Sync
      </button>
    </header>

    <div class="flex gap-2 px-4 py-3">
      <button
        id="save-page"
        class="flex-1 rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700"
      >
        Save page
      </button>
      <button
        id="save-selection"
        class="flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50"
      >
        Save selection
      </button>
    </div>

    <p id="status" class="px-4 pb-2 text-xs text-slate-500"></p>

    <div id="connect-row" class="hidden border-t border-slate-200 px-4 py-3">
      <p class="mb-2 text-xs text-slate-600">
        Saving to this device only. Connect an account to sync.
      </p>
      <button
        id="connect"
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50"
      >
        Connect Google Drive
      </button>
    </div>

    <ul id="list" class="max-h-80 divide-y divide-slate-100 overflow-y-auto border-t border-slate-200"></ul>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
