<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Saver</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="w-[380px]">
    <header class="flex items-center justify-between px-4 pt-4 pb-3">
      <h1 class="flex items-center gap-2 text-sm font-semibold tracking-tight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 size-4 text-clay"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Content Saver
      </h1>
      <button
        id="sync"
        class="flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs text-muted transition-colors hover:bg-soft hover:text-ink"
        title="Sync now"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 size-3.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Sync
      </button>
    </header>

    <div class="flex gap-2 px-4">
      <button
        id="save-page"
        class="flex flex-1 items-center justify-center gap-1.5 rounded-xl bg-clay px-3 py-2.5 text-sm font-medium text-on-clay shadow-sm transition-colors hover:bg-clay-strong"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 size-4"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/></svg>
        Save page
      </button>
      <button
        id="save-selection"
        class="flex flex-1 items-center justify-center gap-1.5 rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium transition-colors hover:bg-soft"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 size-4"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h7"/></svg>
        Save selection
      </button>
    </div>

    <p id="status" class="px-4 pt-2.5 pb-1 text-xs text-muted"></p>

    <div id="connect-row" class="mx-4 mt-2 rounded-xl border border-line bg-surface p-3">
      <p class="mb-2 text-xs leading-relaxed text-muted">
        Saving to this device only. Connect an account to sync across browsers.
      </p>
      <button
        id="connect"
        class="flex w-full items-center justify-center gap-1.5 rounded-lg border border-line bg-canvas px-3 py-2 text-sm font-medium transition-colors hover:bg-soft"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 size-4"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        Connect Google Drive
      </button>
    </div>

    <div class="px-4 pt-1">
      <button id="disconnect" class="hidden text-xs text-muted transition-colors hover:text-rose">
        Disconnect account
      </button>
    </div>

    <ul
      id="list"
      class="mt-3 max-h-[28rem] overflow-y-auto border-t border-line pb-1"
    ></ul>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
